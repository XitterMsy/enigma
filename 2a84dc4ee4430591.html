<div class="stage">
<div class="poem">
  Cada passo deixa rastro,<br>
  O começo diz mais,<br>
  Olhe só a primeira,<br>
  Repare em cada linha,<br>
  Desça bem devagar,<br>
  Encontre quem lidera,<br>
  No topo de tudo,<br>
  Acima de todos,<br>
  Dono da palavra final.<br>
  O nome está aqui,<br>
  Reunido no começo.
</div>
